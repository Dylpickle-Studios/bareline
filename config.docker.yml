server:
  host: 0.0.0.0
  port: 3000
  publicUrl: http://localhost:3000
  tls:
    mode: proxy
storage:
  data: /var/lib/bareline
  repositories: /var/lib/bareline/repositories
  trash: /var/lib/bareline/trash
  lfs: /var/lib/bareline/lfs
  importRoots: []
database:
  path: /var/lib/bareline/app.db
git:
  executable: git
  timeoutMs: 15000
search:
  indexedBranches: []
  maxFilesPerBranch: 10000
  maxCommitsPerBranch: 100
ssh:
  enabled: false
  host: localhost
registration:
  mode: closed
anonymous:
  publicRepositories: true
limits:
  filePreviewBytes: 2097152
  gitOutputBytes: 16777216
  diffBytes: 10485760
  diffLines: 20000
  diffFiles: 500
  diffFileBytes: 2097152
  archiveBytes: 1073741824
  lfsObjectBytes: 5368709120
  requestBodyBytes: 10485760
security:
  sessionDays: 14
  repositoryTrashDays: 7
plugins:
  allowedGitHosts: []
  allowedNpmPackages: []
  npmExecutable: npm
  installTimeoutMs: 60000
authentication:
  oidc: []
  reverseProxy:
    enabled: false
    identityHeader: x-authenticated-user
    displayNameHeader: x-authenticated-name
    allowedAddresses: [127.0.0.1, '::1']
    autoCreate: false

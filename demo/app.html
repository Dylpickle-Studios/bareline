<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Interactive Bareline demo with seeded Git data." />
    <title>Bareline interactive demo</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <a class="skip" href="#app">Skip to content</a>
    <header>
      <a class="brand" id="brand-home" href="#home"
        ><svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
          <rect width="40" height="40" rx="7" fill="#236b5b" />
          <path
            d="M13 8v24m0-12c0-4 3.2-6.5 7.2-6.5H27"
            fill="none"
            stroke="#f6f4ec"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="13" cy="8" r="2.7" fill="#f6f4ec" />
          <circle cx="13" cy="20" r="2.7" fill="#f6f4ec" />
          <circle cx="13" cy="32" r="2.7" fill="#f6f4ec" />
          <circle cx="27" cy="13.5" r="2.7" fill="#f6f4ec" />
        </svg>
        Bareline</a
      >
      <nav>
        <button data-global="explore">Explore</button><button data-global="docs">Docs</button
        ><button id="search">Search <kbd>⌘K</kbd></button
        ><button data-global="groups">Groups</button><button data-global="admin">Admin</button
        ><button data-global="account">Alice Nguyen</button>
      </nav>
    </header>
    <main id="app">
      <section id="home-view" hidden></section>
      <section id="repository-view">
        <section class="repo">
          <div>
            <span>PUBLIC REPOSITORY</span>
            <h1>alice <i>/</i> paper-trail</h1>
            <p>A small, durable record of decisions.</p>
          </div>
          <button class="quiet-action" id="pin">Pin</button>
          <button class="button" id="clone">Clone</button>
        </section>
        <nav class="tabs">
          <button data-view="code">Code</button><button data-view="commits">Commits</button
          ><button data-view="branches">Branches</button><button data-view="tags">Tags</button
          ><button data-view="compare">Compare</button><button id="settings">Settings</button>
        </nav>
        <button class="activity-link" data-view="activity">View repository activity</button>
        <section id="view" aria-live="polite"></section>
      </section>
    </main>
    <dialog id="modal">
      <form method="dialog">
        <header><strong id="modal-title">Bareline demo</strong><button>Close</button></header>
        <div id="modal-content"></div>
      </form>
    </dialog>
    <footer>
      <span>Static Bareline demonstration · changes stay in this browser</span
      ><button id="reset">Reset demo data</button><button data-global="logout">Log out</button
      ><button id="theme">Theme</button>
    </footer>
    <script src="app.js"></script>
  </body>
</html>

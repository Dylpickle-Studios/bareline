name: Deploy design preview

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      # A repository administrator can add this fine-grained token with Pages write and
      # Administration write permissions to enable Pages on the first run. GITHUB_TOKEN cannot
      # create a Pages site, so normal deployments keep using the least-privileged token.
      - if: ${{ env.PAGES_ADMIN_TOKEN != '' }}
        uses: actions/configure-pages@v6
        with:
          enablement: true
          token: ${{ env.PAGES_ADMIN_TOKEN }}
      - if: ${{ env.PAGES_ADMIN_TOKEN == '' }}
        uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy design preview

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A repository administrator can add this fine-grained token with Pages write and
      # Administration write permissions to enable Pages on the first run. GITHUB_TOKEN cannot
      # create a Pages site, so normal deployments keep using the least-privileged token.
      - if: ${{ env.PAGES_ADMIN_TOKEN != '' }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
          token: ${{ env.PAGES_ADMIN_TOKEN }}
      - if: ${{ env.PAGES_ADMIN_TOKEN == '' }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Verify Pages site
        run: |
          test -f "${GITHUB_WORKSPACE}/demo/index.html"
          test -f "${GITHUB_WORKSPACE}/demo/app.css"
          test -f "${GITHUB_WORKSPACE}/demo/app.js"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ github.workspace }}/demo
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

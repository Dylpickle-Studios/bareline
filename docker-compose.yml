services:
  bareline:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    pids_limit: 256
    mem_limit: 1g
    ports:
      - '3000:3000'
    volumes:
      - bareline-data:/var/lib/bareline
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bareline-data:
